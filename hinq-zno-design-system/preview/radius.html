<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HINQ — Radius</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-paper); font-family: var(--font-body); }
  .row { display: flex; gap: 20px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 84px; height: 84px; background: var(--hinq-primary-50); border: 1px solid var(--hinq-primary-100); }
  .name { font-weight: 600; font-size: 12px; }
  .px { color: var(--fg-2); font-family: var(--font-mono); font-size: 11px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:0"></div><div class="name">none</div><div class="px">0 px · drawers</div></div>
    <div class="item"><div class="box" style="border-radius:2px"></div><div class="name">xs</div><div class="px">2 px</div></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">sm <em style="color:var(--fg-2);font-style:normal">(default)</em></div><div class="px">4 px · cards, btns</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">md</div><div class="px">8 px · alerts</div></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><div class="name">pill</div><div class="px">∞ · chips, fab</div></div>
  </div>
</body>
</html>
