<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HINQ — Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-paper); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: 64px 1fr 90px; align-items: center; gap: 16px; padding: 4px 0; }
  .bar { height: 14px; background: var(--hinq-primary-main); border-radius: 2px; }
  .name { font-weight: 600; font-size: 12px; }
  .px { color: var(--fg-2); font-family: var(--font-mono); font-size: 11px; text-align: right; }
</style>
</head>
<body>
  <div class="row"><div class="name">space‑1</div><div class="bar" style="width:8px"></div><div class="px">8 px · 1×</div></div>
  <div class="row"><div class="name">space‑2</div><div class="bar" style="width:16px"></div><div class="px">16 px · 2×</div></div>
  <div class="row"><div class="name">space‑3</div><div class="bar" style="width:24px"></div><div class="px">24 px · 3×</div></div>
  <div class="row"><div class="name">space‑4</div><div class="bar" style="width:32px"></div><div class="px">32 px · 4×</div></div>
  <div class="row"><div class="name">space‑5</div><div class="bar" style="width:40px"></div><div class="px">40 px · 5×</div></div>
  <div class="row"><div class="name">space‑6</div><div class="bar" style="width:48px"></div><div class="px">48 px · 6×</div></div>
  <div class="row"><div class="name">space‑8</div><div class="bar" style="width:64px"></div><div class="px">64 px · 8×</div></div>
</body>
</html>
