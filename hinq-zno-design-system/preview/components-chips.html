<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HINQ — Chips</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--bg-paper); font-family: var(--font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .row + .row { margin-top: 12px; }
  .label { font-size: 10px; color: var(--fg-2); font-family: var(--font-mono); letter-spacing: 0.4px; text-transform: uppercase; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: var(--radius-pill);
    font-size: 13px; letter-spacing: 0.16px; font-weight: 400;
    background: rgba(0,0,0,0.08); color: var(--fg-1); border: 1px solid transparent;
  }
  .chip.filled-primary { background: var(--hinq-primary-main); color: white; }
  .chip.filled-error   { background: var(--hinq-error-main); color: white; }
  .chip.filled-success { background: var(--hinq-success-main); color: white; }
  .chip.outline-primary { background: transparent; border-color: var(--hinq-primary-main); color: var(--hinq-primary-main); }
  .chip.soft-info       { background: var(--hinq-info-light); color: var(--hinq-info-dark); }
  .chip.soft-warn       { background: #FFE0B2; color: #6E4400; }
  .chip .x { width: 16px; height: 16px; opacity: 0.7; cursor: pointer; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>
  <div class="label">filled · status</div>
  <div class="row">
    <span class="chip filled-primary">General filters active <svg class="x" viewBox="0 0 24 24" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span>
    <span class="chip filled-error">Palliatively marked patient</span>
    <span class="chip filled-success">All sources retrieved</span>
  </div>

  <div class="label" style="margin-top:14px">outlined · soft</div>
  <div class="row">
    <span class="chip outline-primary">Active</span>
    <span class="chip soft-info"><span class="dot" style="background:var(--hinq-info-main)"></span>Connected · Hix</span>
    <span class="chip soft-warn"><span class="dot" style="background:#CA4949"></span>1/12 sources not retrieved</span>
    <span class="chip">Patient · BSN 999990123</span>
  </div>
</body>
</html>
