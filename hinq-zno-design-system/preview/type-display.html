<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HINQ — Display type (Montserrat)</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-paper); }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 16px; padding: 6px 0; }
  .row + .row { border-top: 1px solid var(--border); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><div class="h1">Personal data</div><div class="meta">h1 · 28/117 · 600</div></div>
  <div class="row"><div class="h2">Medical history</div><div class="meta">h2 · 24/120 · 600 · 0.25</div></div>
  <div class="row"><div class="h3">Treatment directives</div><div class="meta">h3 · 20/120 · 600</div></div>
  <div class="row"><div class="h4">Diagnoses & episodes</div><div class="meta">h4 · 18/124 · 600 · 0.25</div></div>
  <div class="row"><div class="h5">No data available</div><div class="meta">h5 · 16/133 · 600</div></div>
  <div class="row"><div class="h6">Last updated</div><div class="meta">h6 · 14/150 · 600 · 0.15</div></div>
</body>
</html>
